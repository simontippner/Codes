# Solvent mixture by mole fraction: water (SPC/Fw) and methanol (GAFF2), 50 mol% each, 4 chains of 8 units.
# Run:  python3 ../../brush_builder.py config_methanol.toml all
output = "output_methanol"

[tools]
packmol = "packmol"                 # path to the PACKMOL executable (20.x)

# RESP-charged monomers (B3LYP-D3(BJ)/def2-SVP Merz-Kollman ESP, see qm/*.gjf, fitted with antechamber -c resp):
# key -> residue names H<key> (head), D<key> (middle), T<key> (tail); A and B are the two stereoisomers
[monomers]
DA = { ac = "monomers/dda.ac", protonated = false }
DB = { ac = "monomers/ddb.ac", protonated = false }
PA = { ac = "monomers/dpa.ac", protonated = true }
PB = { ac = "monomers/dpb.ac", protonated = true }

# prepgen definitions (atom names of the monomer files): backbone from head_name to tail_name; the head unit keeps
# the end group (methyl, stand-in for the polystyrene block), the tail unit keeps the H cap
[residues]
head_name = "C7"
tail_name = "C6"
end_group_atoms = ["C8", "H13", "H14", "H15"]
cap_atom = "H19"
pre_head_type = "c3"
post_tail_type = "c3"

[chains]
n_units = 8
alpha = 0.5                         # fraction of protonated units
seed = 1

[brush]
chains_per_box = 4
grafting_density = 0.5             # chains per nm^2: box side sqrt(4 / 0.5) nm = 28.3 A
min_distance = 5.0                  # minimum distance between chains during packing (A)
anchor_atom = 2                     # atom of the head unit grafted to the plane
anchor_z = 1.2
max_attempts = 2                    # attempts per chain before restarting with chain 1
max_fail = 30                       # failed packings before the region is enlarged (densest mode)
box_step = 0.5                      # densest mode: widening of the first box (A)
region_step = 1.0                   # densest mode: enlargement of the 3 x 3 region (A)

[solvent]
water_model = "spcfw"               # tip3p, spce, opc or spcfw
layer = 30.0                        # solvent above the brush (A), or "auto" = max(30 A, half the brush height)
margin = 0.0                        # solvent packed beyond the cell before the cut (A); 0: only the cell
counterion = "Cl-"
shell_single = 30.0                 # solvent around single chains (step single)
mode = "mole"                       # fractions as vol% ("volume") or mole fractions ("mole")
# density_mix = 0.99                # measured density of the mixture (g/cm3); default: ideal mixing of volumes
# one table per component; water uses the built-in model, other solvents need a one-molecule structure, their
# residue files (prepi/lib) and frcmod, and the density of the pure liquid (g/cm3, for vol% and the mixture density)
[[solvent.components]]
name = "water"
fraction = 50

[[solvent.components]]
name = "methanol"
fraction = 50
density = 0.792
structure = "solvents/methanol/methanol.pdb"
params = ["solvents/methanol/methanol.prepi", "solvents/methanol/methanol.frcmod"]

